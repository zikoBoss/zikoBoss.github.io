<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XCT Community — Join Us</title>
<meta name="description" content="XCT Community — Join us on Telegram. Tools, emotes, and everything a Free Fire player needs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0b;
    color: #f5f5f5;
    font-family: "Cairo", "Segoe UI", Tahoma, Arial, sans-serif;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background-image: radial-gradient(600px 300px at 50% 0%, rgba(225, 6, 0, 0.28), transparent 70%);
    background-repeat: no-repeat;
  }
  .mac {
    background: #1a1a1d;
    border: 1px solid #2b2b30;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
    width: 100%;
    max-width: 860px;
  }
  .mac-bar {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 11px 14px;
    background: #232326;
    border-bottom: 1px solid #2b2b30;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .dot-red { background: #ff5f57; }
  .dot-yellow { background: #febc2e; }
  .dot-green { background: #28c840; }
  .mac-title {
    flex: 1;
    text-align: center;
    color: #9d9da6;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mac-body { padding: 48px 40px; text-align: center; }
  .badge {
    display: inline-block;
    border: 1px solid #e10600;
    color: #ff5a4e;
    border-radius: 999px;
    padding: 5px 16px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  h1 {
    font-size: clamp(38px, 6vw, 64px);
    font-weight: 900;
    line-height: 1.2;
    margin: 20px 0 14px;
  }
  h1 span { color: #ff2a23; }
  .phrase {
    color: #b8b8c0;
    font-size: 18px;
    max-width: 560px;
    margin: 0 auto 28px;
    line-height: 1.7;
  }
  .btn {
    display: inline-block;
    padding: 14px 32px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 17px;
    text-decoration: none;
    background: linear-gradient(135deg, #ff2a23, #e10600);
    color: #fff;
    box-shadow: 0 8px 30px rgba(225, 6, 0, 0.45);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 36px rgba(225, 6, 0, 0.55);
  }
  .note { margin-top: 18px; font-size: 14px; color: #777; }
  @media (max-width: 640px) {
    .mac-body { padding: 36px 20px; }
  }
</style>
</head>
<body>

  <div class="mac">
    <div class="mac-bar">
      <span class="dot dot-red"></span><span class="dot dot-yellow"></span><span class="dot dot-green"></span>
      <span class="mac-title">XCT Community</span>
    </div>
    <div class="mac-body">
      <span class="badge">Free Fire &nbsp;•&nbsp; Team XCT</span>
      <h1><span>XCT</span> Community</h1>
      <p class="phrase">Join us — tools, emotes, and everything a Free Fire player needs, built and maintained by the team.</p>
      <a class="btn" href="https://t.me/addlist/3dwlxi0W74Q1ZDM8" target="_blank" rel="noopener">Join the Community →</a>
      <p class="note">One tap joins all our Telegram channels.</p>
    </div>
  </div>

</body>
</html>
